# Manifiesto para redirigir el tráfico según el HOST a las aplicaciones correspondientes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iot-ingress
spec:
  rules:
  # Reglas explícitas para app1
  - host: app1.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app1
            port:
              number: 80
  # Reglas explícitas para app2
  - host: app2.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app2
            port:
              number: 80
  # Subject: "Otherwise, app3 will be selected by default".
  # Al no poner 'host', Traefik entiende que esto es el "catch-all" y redirige el tráfico a app3.
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app3
            port:
              number: 80
