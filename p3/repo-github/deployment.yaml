# Este archivo es el que esta en el repositorio de github, NO SE UTILIZA, SOLO PARA REVISIÓN. 
# Contiene la definicion del deployment y del service para la aplicacion mlezcano-playground. 

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlezcano-playground
  namespace: dev      # namespace dev, especificado por el subject
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playground
  template:
    metadata:
      labels:
        app: playground
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: mlezcano-playground
        image: mikelezc/playground:v1
        env:
        - name: VERSION
          value: "v1"
        ports:
        - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: mlezcano-playground
  namespace: dev
spec:
  type: NodePort
  ports:
  - port: 8888
    targetPort: 8888
    nodePort: 30080
  selector:
    app: playground
