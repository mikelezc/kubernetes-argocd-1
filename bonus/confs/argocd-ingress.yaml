# Ingress para exponer Argo CD por HTTP a través de Traefik.
# Lo aplica scripts/install.sh tras habilitar server.insecure en Argo CD.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
spec:
  ingressClassName: traefik
  rules:
  - host: localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
